<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d171e"><title>事件画册 · 异世界禁止玩梗</title><link rel="icon" href="data:,"><link rel="stylesheet" href="run.css?v=20260926-event-art"><link rel="stylesheet" href="event-ui.css?v=20260926-event-art"><style>
body{padding:24px 16px}.gallery{max-width:1120px;margin:auto}.gallery-heading{display:flex;align-items:center;justify-content:space-between;gap:20px}.gallery-heading h1{font-size:26px;margin:0}.gallery-heading p{font-size:13px;color:#c0b98e;margin:4px 0 20px}.gallery-heading a{white-space:nowrap;font-size:13px}.gallery-tabs{display:flex;gap:8px;overflow:auto;padding:0 0 14px}.gallery-tabs button{white-space:nowrap;font-size:13px}.gallery-tabs button[aria-pressed=true],.gallery-tabs button[aria-pressed=true]:hover{background:#d5dca5;color:#1b342d}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.gallery-card{display:flex;flex-direction:column;align-self:start;padding:0;overflow:hidden;text-align:left;border:1px solid #a69a6755;border-radius:8px;background:#1c3135}.gallery-picture{width:100%;flex-shrink:0;position:relative;aspect-ratio:5/3;--event-height:0px;overflow:hidden}.gallery-card strong{display:block;padding:10px 12px;font-size:14px;color:#ecdfba}.gallery-card:hover .event-art{filter:brightness(1.08)}dialog{padding:0;max-width:920px;overflow:hidden}dialog .gallery-picture{margin:0}dialog .caption{padding:20px 24px}dialog h2{margin:0 36px 7px 0;font-size:22px}dialog p{margin:0;color:#c5d4c8}dialog .modal-close{z-index:2;background:#11252eee;color:#fff0cf;box-shadow:0 0 0 1px #e2cf9c4d}.gallery-count{font-size:12px;color:#a9bdb3;margin:18px 0}@media(max-width:650px){body{padding:16px 12px}.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery-heading h1{font-size:21px}.gallery-heading p{font-size:11px}.gallery-card strong{font-size:12px;padding:8px}.gallery-tabs button{font-size:12px;padding:7px 10px}dialog .caption{padding:16px}dialog h2{font-size:18px}}@media(max-width:360px){.gallery-grid{grid-template-columns:1fr}}
</style><link rel="icon" href="data:,">
</head><body><main class="gallery"><header class="gallery-heading"><div><h1>这一路，全是名场面</h1><p>60个事件 · 60幅独立场景插画</p></div><a href="./?v=20260926-event-art">返回游戏 →</a></header><nav class="gallery-tabs" aria-label="章节"></nav><section class="gallery-grid" aria-label="事件插画"></section><p class="gallery-count"></p></main><dialog id="art-modal"><button class="modal-close" aria-label="关闭">×</button><div id="art-content"></div></dialog><script src="run-data.js?v=20260926-event-art"></script><script src="run-events.js?v=20260926-event-art"></script><script src="event-art.js?v=20260926-event-art"></script><script>
const A=MemeEventArt,S=MemeEventScenes,D=MemeRunData,modal=document.getElementById('art-modal');let chapter=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function picture(id){const art=A.get(id);return '<div class="gallery-picture" style="aspect-ratio:'+art.ratio+'"><div class="event-art" style="'+A.style(art)+'"></div></div>';}
function render(){document.querySelector('.gallery-tabs').innerHTML=D.chapters.map((c,i)=>'<button data-chapter="'+i+'" aria-pressed="'+(i===chapter)+'">'+esc(c)+'</button>').join('');document.querySelector('.gallery-grid').innerHTML=A.packs[chapter].ids.map(id=>'<button class="gallery-card" data-art="'+id+'" aria-label="放大'+esc(S.entries[id][4])+'">'+picture(id)+'<strong>'+esc(S.entries[id][4])+'</strong></button>').join('');document.querySelector('.gallery-count').textContent=D.chapters[chapter]+' · 10幅';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.chapter!==undefined){chapter=Number(b.dataset.chapter);render();}if(b.dataset.art){const id=b.dataset.art;document.getElementById('art-content').innerHTML=picture(id)+'<div class="caption"><h2>'+esc(S.entries[id][4])+'</h2><p>'+esc(S.entries[id][3])+'</p></div>';modal.showModal();}if(b.classList.contains('modal-close'))modal.close();});modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close();}});render();
</script></body></html>
